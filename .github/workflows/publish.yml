# Publishes the SDK packages to the public registries for a released tag.
# OIDC Trusted Publishing — no stored API keys. One-time registry setup per package:
# see the reusable workflow header in Vev-software/.github.
#
# NOTE: BOTH publish jobs are INLINED here (not delegated to the org reusable
# workflow). Trusted Publishing matches the OIDC `job_workflow_ref`, and a
# reusable-workflow boundary moves that ref to Vev-software/.github — which no
# per-repo policy matches:
#   * nuget — NuGet/login rejects org-owned policies across the boundary; the OIDC
#     `job_workflow_ref` points at Vev-software/.github and the lookup fails with
#     HTTP 401 (https://github.com/NuGet/login/issues/6).
#   * npm — the SAME class of failure (observed empirically on the fabric-contracts
#     sibling package: delegated npm publish returned E404, npm's "unauthorized" for a
#     scoped package, because the per-repo npm Trusted Publisher policy is registered
#     as workflow=publish.yml, which the reusable ref does not match). The org reusable
#     workflow's claim that "npm is unaffected" does NOT hold.
# Inlining both keeps `job_workflow_ref` = atlas-contracts/.github/workflows/publish.yml,
# matching the per-repo policies (repo=atlas-contracts, workflow=publish.yml, env=release).
# `NUGET_USER` must be the policy CREATOR's personal username (not the org owner).
# Revert the nuget job to the reusable workflow once NuGet/login#6 is fixed; keep npm
# inlined unless the org policy is re-registered against the reusable workflow ref.
name: publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Released tag to publish (e.g. v0.2.0). Must already exist (cut by release.yml)."
        type: string
        required: true
      publish_nuget:
        description: "Publish Vev.Atlas.Contracts to nuget.org"
        type: boolean
        default: true
      publish_npm:
        description: "Publish @vev-software/atlas-contracts to npm"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Inlined nuget publish (see file header for why). Mirrors the reusable workflow's
  # nuget job; keep the two in sync.
  nuget:
    name: publish · nuget.org
    if: ${{ !github.event.repository.fork && inputs.publish_nuget }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC for NuGet Trusted Publishing — no API key
    steps:
      # Check out the released tag with full history so MinVer derives that version.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup .NET (pinned by global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build + test (public feeds only)
        run: |
          dotnet restore AtlasContracts.slnx
          dotnet build AtlasContracts.slnx -c Release --no-restore
          dotnet test AtlasContracts.slnx -c Release --no-build

      # No --no-build: MinVer stamps the version (from the checked-out tag) during pack.
      - name: Pack
        run: dotnet pack sdk/dotnet/Vev.Atlas.Contracts/Vev.Atlas.Contracts.csproj -c Release -o artifacts

      # Exchange the GitHub OIDC token for a short-lived nuget.org API key. Needs a
      # trusted-publishing policy on nuget.org and the repo variable NUGET_USER.
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  # Inlined npm publish (see file header for why). Mirrors the reusable workflow's
  # npm job; keep the two in sync. Inlining keeps the OIDC ref = atlas-contracts/
  # publish.yml so the per-repo npm Trusted Publisher policy matches.
  npm:
    name: publish · npm
    if: ${{ !github.event.repository.fork && inputs.publish_npm }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC for npm Trusted Publishing + build provenance
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing (tokenless OIDC) needs a recent npm (>= 11.5.1).
      - name: Update npm
        run: npm install -g npm@latest

      # Stamp the npm version from the tag (vX.Y.Z -> X.Y.Z) — same source as .NET.
      - name: Build
        working-directory: sdk/typescript
        env:
          TAG: ${{ inputs.tag }}
        run: |
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version
          npm install
          npm run build

      # No NODE_AUTH_TOKEN: OIDC Trusted Publishing supplies the credential and
      # npm attaches a signed provenance statement automatically.
      - name: Publish to npm (Trusted Publishing)
        working-directory: sdk/typescript
        run: npm publish --access public
