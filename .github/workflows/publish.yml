name: publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Released tag to publish (e.g. v0.2.0). Must already exist (cut by release.yml)."
        type: string
        required: true
      publish_nuget:
        description: "Publish Vev.Atlas.Contracts to nuget.org"
        type: boolean
        default: true
      publish_npm:
        description: "Publish @vev-software/atlas-contracts to npm"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    uses: Vev-software/.github/.github/workflows/publish-dotnet-npm.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      tag: ${{ inputs.tag }}
      solution: AtlasContracts.slnx
      dotnet_project: sdk/dotnet/Vev.Atlas.Contracts/Vev.Atlas.Contracts.csproj
      ts_dir: sdk/typescript
      publish_nuget: ${{ inputs.publish_nuget }}
      publish_npm: ${{ inputs.publish_npm }}
