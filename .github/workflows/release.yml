# Auto-fires when the `release` workflow (publish.yml) pushes a vX.Y.Z tag. Creates the signed
# GitHub Release + Sigstore provenance attestations. Registry publishing lives in publish.yml.
name: github release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    uses: Vev-software/.github/.github/workflows/release-dotnet-npm.yml@main
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      solution: AtlasContracts.slnx
      dotnet_project: sdk/dotnet/Vev.Atlas.Contracts/Vev.Atlas.Contracts.csproj
      ts_dir: sdk/typescript
