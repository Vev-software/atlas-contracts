# Adds every newly opened/reopened/transferred issue in this repo to the
# Vev-software org Project board (#1), so status is tracked across all repos.
#
# Requires the ORG secret ADD_TO_PROJECT_PAT (classic PAT with `project` + `repo`
# scopes); the default GITHUB_TOKEN cannot write to Projects v2.
#
# This same file is dropped verbatim into every repo that should feed the board.
name: Add issues to project

on:
  issues:
    types: [opened, reopened, transferred]
  # Uncomment to also add pull requests to the board:
  # pull_request:
  #   types: [opened, reopened]

permissions:
  contents: read

jobs:
  add-to-project:
    name: Add to Vev-software board
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/Vev-software/projects/1
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
          # Optional label filter — omit to add ALL issues:
          # labeled: milestone, priority:high
          # label-operator: OR
